appId: com.cerebro.app
productName: Cerebro
artifactName: Cerebro-${version}-${arch}.${ext}
directories:
  buildResources: build
beforePack: scripts/check-cli-runtime.cjs
afterPack: scripts/check-mux-runtime.cjs
extraResources:
  - from: out/cli
    to: cli
  - from: out/cli/node_modules/node-pty
    to: cli/node_modules/node-pty
files:
  - '!out/cli/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  icon: resources/branding/Cerebro.icon
  binaries:
    - Contents/Resources/cli/node
    - Contents/Resources/cli/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper
    - Contents/Resources/cli/node_modules/node-pty/prebuilds/darwin-arm64/pty.node
    - Contents/Resources/cli/node_modules/node-pty/prebuilds/darwin-x64/spawn-helper
    - Contents/Resources/cli/node_modules/node-pty/prebuilds/darwin-x64/pty.node
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
npmRebuild: false
