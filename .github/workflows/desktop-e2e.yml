name: Desktop e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (${{ matrix.group }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        group: [app, projects, terminal, chat, changes]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm --filter desktop build

      - name: Run desktop Playwright e2e (${{ matrix.group }})
        run: pnpm --filter desktop test:e2e:${{ matrix.group }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ matrix.group }}
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: ignore
